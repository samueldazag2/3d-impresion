# Activate with SPRING_PROFILES_ACTIVE=local for day-to-day development
# without a local PostgreSQL instance.
spring:
  datasource:
    url: jdbc:h2:mem:printcoststudio
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

app:
  security:
    jwt:
      # Dev-only secret, never used outside the local profile.
      secret: local-development-secret-key-please-change-me-32bytes
    cors:
      allowed-origins: http://localhost:5173
    admin:
      email: ${ADMIN_EMAIL:admin@printcoststudio.local}
      password: ${ADMIN_PASSWORD:changeme123}
